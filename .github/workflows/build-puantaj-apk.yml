name: Build Puantaj Paneli APK

on:
  push:
    branches: [main]
    paths:
      - 'puantaj-apk/**'
      - '.github/workflows/build-puantaj-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'puantaj-apk/**'
      - '.github/workflows/build-puantaj-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: puantaj-apk
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp puantaj-apk/app/build/outputs/apk/debug/app-debug.apk Puantaj-Paneli.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Puantaj-Paneli-APK
          path: Puantaj-Paneli.apk
          if-no-files-found: error
          retention-days: 7
